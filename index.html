<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>VILLA VIBE MIXTAPES</title>
  <script>try{var s=JSON.parse(localStorage.getItem("bro.settings")||"{}");if(s.theme)document.documentElement.dataset.theme=s.theme}catch(e){}</script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-layer" id="bgLayer"></div>
  <div class="bg-dim"></div>

  <div class="app">
    <header class="topbar">
      <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true" id="brandIcon"></svg><span id="brandName">VILLA VIBE MIXTAPES</span></div>
      <input id="search" type="search" placeholder="Поиск треков" autocomplete="off" aria-label="Поиск треков">
      <button class="icon-btn" id="bHelp" aria-label="Справка" title="Справка" data-icon="help"></button>
      <button class="icon-btn" id="bSettings" aria-label="Настройки" title="Настройки вида" data-icon="settings"></button>
    </header>

    <nav class="sidebar" id="sidebar" aria-label="Навигация"></nav>

    <main class="content" id="content"></main>

    <aside class="np no-track" id="np" aria-label="Сейчас играет">
      <button class="icon-btn np-close" id="npClose" aria-label="Свернуть" title="Свернуть" data-icon="down"></button>
      <div class="np-inner">
        <div class="vinyl" id="vinyl"><div class="disc"><div class="label" id="npLabel"></div></div></div>
        <div class="np-title" id="npTitle">Выберите трек</div>
        <div class="np-sub" id="npSub"></div>
        <div class="np-wave" id="npWave" title="Нажмите, чтобы перемотать"><canvas id="npCanvas" aria-label="Волновая форма"></canvas></div>
        <div class="np-time"><span id="npCur">0:00</span><span id="npDur">0:00</span></div>
        <div class="np-controls">
          <button class="icon-btn" id="npPrev" aria-label="Предыдущий" data-icon="prev"></button>
          <button class="play-btn" id="npPlay" aria-label="Играть"></button>
          <button class="icon-btn" id="npNext" aria-label="Следующий" data-icon="next"></button>
        </div>
        <div class="np-actions">
          <button class="icon-btn fav-btn" id="npFav" aria-label="В избранное" title="В избранное" data-icon="heart"></button>
          <button class="icon-btn js-menu-btn" id="npAdd" aria-label="Добавить в плейлист" title="Добавить в плейлист" data-icon="plus"></button>
          <button class="icon-btn js-menu-btn" id="npShare" aria-label="Поделиться ссылкой" title="Скопировать ссылку" data-icon="link"></button>
          <a class="icon-btn" id="npDl" aria-label="Скачать" title="Скачать" target="_blank" rel="noopener" data-icon="download"></a>
        </div>
        <div class="np-info" id="npInfo" hidden></div>
      </div>
    </aside>

    <footer class="player" id="player">
      <div class="p-now">
        <div class="cover p-cover" id="pCover"></div>
        <div class="p-meta" id="pMeta">
          <div class="p-title" id="pTitle">Выберите трек</div>
          <div class="p-sub" id="pSub"></div>
        </div>
        <button class="icon-btn fav-btn" id="pFav" aria-label="В избранное" data-icon="heart"></button>
      </div>

      <div class="p-center">
        <div class="p-controls">
          <button class="icon-btn" id="bShuffle" aria-label="Перемешать" title="Перемешать" data-icon="shuffle"></button>
          <button class="icon-btn" id="bPrev" aria-label="Предыдущий" title="Предыдущий" data-icon="prev"></button>
          <button class="play-btn" id="bPlay" aria-label="Играть" title="Играть / пауза"></button>
          <button class="icon-btn" id="bNext" aria-label="Следующий" title="Следующий" data-icon="next"></button>
          <button class="icon-btn" id="bRepeat" aria-label="Повтор" title="Повтор" data-icon="repeat"><span class="badge-one">1</span></button>
        </div>
        <div class="p-seek">
          <span id="tCur">0:00</span>
          <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Перемотка">
          <span id="tDur">0:00</span>
        </div>
      </div>

      <div class="p-right">
        <button class="icon-btn js-menu-btn" id="bSleep" aria-label="Таймер сна" title="Таймер сна">
          <span data-icon="timer"></span><span class="sleep-label" id="sleepLabel"></span>
        </button>
        <div class="vol">
          <button class="icon-btn" id="bMute" aria-label="Звук" data-icon="volume"></button>
          <input type="range" id="vol" min="0" max="100" value="100" aria-label="Громкость">
        </div>
      </div>
    </footer>
  </div>

  <audio id="audio" preload="none"></audio>
  <div class="menu" id="menu" hidden></div>
  <div class="toast" id="toast" hidden></div>
  <div class="wave-tip" id="waveTip" hidden></div>

  <script src="config.js"></script>
  <script src="help.js"></script>
  <script src="app.js"></script>
</body>
</html>
